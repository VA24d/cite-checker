name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install pdftotext (PDF sources)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Tests
        run: python -m pytest -n auto -q -p no:testmon

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plugin manifests and version
        run: python package.py --check
      - name: Build skill and plugin archives
        run: python package.py
      - name: Install into a scratch project
        run: |
          mkdir -p /tmp/project
          cd /tmp/project && python "$GITHUB_WORKSPACE/install.py" --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cite-checker-archives
          path: dist/*.zip
